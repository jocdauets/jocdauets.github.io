<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="data.js"></script>
    <script type="text/javascript" src="tornejos.js"></script>
    <script type="text/javascript" src="script.js"></script>
    <script type="text/javascript" src="rdp_database.js"></script>
    <script type="text/javascript" src="rdp.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    td {
        width: 60pt;
        text-align: center;
    }
    </style>
    <title>Dauets</title>
</head>
<body>
    <h1>Dauets</h1>

    <div>
        <p>Adreces d'interès:</p>

        <ul id="adreces_interes">
            <li><a href="/jugadors.html">Cercador de jugadors</a></li>
            <li><a href="/comparador_jugadors.html">Comparador de jugadors</a></li>
            <li><a href="/marcador.html">Marcador</a></li>
            <li><a href="/solitari.html">Dauets solitari</a></li>
        </ul>
    </div>

    <h2>Rànquing de Dauets Professional</h2>
    <div id="classificacio">
        Regió: <select id="seleccionar-regio">
            <option value="mundial">Mundial</option>
        </select>
        <br><br>
        Data: <input type="date" id="seleccionar-data">
        <br><br>
        <div id="taula-classificacio">
        </div>
    </div>

    <script>
        for (var i = 0; i < _tornejos.length; i ++) {
            var li = document.createElement("li");
            var link = document.createElement("a");
            link.href = "/tornejos/" + _tornejos[i].abreviatura + ".html";
            link.innerHTML = _tornejos[i].nom;
            li.appendChild(link);
            document.getElementById("adreces_interes").appendChild(li);
        }

        const regions = Object.keys(_regions);
        for (var i = 0; i < regions.length; i ++) {
            const opcio = document.createElement("option");
            opcio.value = regions[i];
            opcio.innerHTML = regions[i];
            document.getElementById("seleccionar-regio").appendChild(opcio);
        }

        document.getElementById("seleccionar-regio").addEventListener("change", actualitzar_taula_regional);
        document.getElementById("seleccionar-data").addEventListener("change", actualitzar_taula_regional);

        document.getElementById("seleccionar-data").valueAsDate = new Date();

        actualitzar_taula_regional();

        function actualitzar_taula_regional() {
            const regio = document.getElementById("seleccionar-regio").value;
            const data = new Date(document.getElementById("seleccionar-data").value);
            data.setHours(23);
            data.setMinutes(59);
            data.setSeconds(59);

            //const [ultim,grup] = calcular_rdp(_partides);
            const rdp_historic = calcular_rdp(_partides);
            var ultim = null;
            var ultima_data = null;
            for (var i = 0; i < Object.keys(rdp_historic).length; i ++) {
                const data_provisional = new Date(Object.keys(rdp_historic)[i]);
                if (ultima_data == null && data_provisional <= data) {
                    ultima_data = data_provisional;
                    ultim = rdp_historic[ultima_data];
                } else if (ultima_data != null) {
                    if (ultima_data < data_provisional && data_provisional <= data) {
                        ultima_data = data_provisional;
                        ultim = rdp_historic[ultima_data]
                    }
                }
            }
            var grup = calcular_lliga(ultim);
            const jugadors = Object.keys(ultim);
            for (var i = jugadors.length-1; i >= 0; i --) {
                if (regio != "mundial") {
                    if (_regions[regio].includes(jugadors[i]) == false) {
                        jugadors.splice(i,1);
                    }
                }
            }
            var taula = document.createElement("table");
            var header = document.createElement("tr");
            var header_posicio = document.createElement("th");
            header_posicio.innerHTML = "Posició";
            var header_jugadors = document.createElement("th");
            header_jugadors.innerHTML = "Jugador/a";
            var header_daus = document.createElement("th");
            header_daus.innerHTML = "Daus";
            var header_grup = document.createElement("th");
            header_grup.innerHTML = "Grup";
            header.appendChild(header_posicio);
            header.appendChild(header_jugadors);
            header.appendChild(header_daus);
            header.appendChild(header_grup);
            taula.appendChild(header);

            var posicions = {};
            var jugadors_afegits = [];
            while (jugadors_afegits.length < jugadors.length) {
                var afegir = false;
                for (var i = 0; i < jugadors.length; i ++) {
                    if (jugadors_afegits.includes(jugadors[i]) == false) {
                        if (afegir == false) {
                            afegir = jugadors[i];
                        } else if (ultim[jugadors[i]] > ultim[afegir]) {
                            afegir = jugadors[i];
                        }
                    }
                }
                if (jugadors_afegits.length == 0) {
                    jugadors_afegits.push(afegir);
                    posicions[afegir] = 1;
                } else {
                    if (ultim[afegir] == ultim[jugadors_afegits[jugadors_afegits.length-1]]) {
                        posicions[afegir] = posicions[jugadors_afegits[jugadors_afegits.length-1]];
                        jugadors_afegits.push(afegir);
                    } else {
                        jugadors_afegits.push(afegir);
                        posicions[afegir] = jugadors_afegits.length;
                    }
                }
                var fila = document.createElement("tr");
                var cella_posicio = document.createElement("td");
                cella_posicio.innerHTML = posicions[afegir].toString();
                fila.appendChild(cella_posicio);
                var cella_jugador = document.createElement("td");
                var link_jugador = document.createElement("a");
                link_jugador.href = "/jugadors.html?jugador=" + afegir;
                link_jugador.classList = ["link-cercar"];
                link_jugador.innerHTML = afegir;
                cella_jugador.appendChild(link_jugador);
                fila.appendChild(cella_jugador);
                var cella_daus = document.createElement("td");
                cella_daus.innerHTML = ultim[afegir].toString();
                fila.appendChild(cella_daus);
                var cella_grup = document.createElement("td");
                cella_grup.innerHTML = ["Capdav.","Boldró","Cua"][grup[afegir]-1];
                fila.appendChild(cella_grup);
                taula.appendChild(fila);
            }

            document.getElementById("taula-classificacio").innerHTML = "";
            document.getElementById("taula-classificacio").appendChild(taula);
        }
    </script>
</body>
</html>
