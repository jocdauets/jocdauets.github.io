<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="data.js"></script>
    <script type="text/javascript" src="tornejos.js"></script>
    <script type="text/javascript" src="script.js"></script>
    <script type="text/javascript" src="rdp_database.js"></script>
    <script type="text/javascript" src="rdp.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    tr {
        height: 25px;
    }
    td {
        text-align: center;
    }
    .classificacio-posicio {
        width: 30px;
        border-right-style: hidden;
    }
    .classificacio-jugador {
        width: 100px;
        text-align: left;
        padding: 0px 10px;
        border-left-style: hidden;
    }
    .classificacio-daus {
        width: 30px;
        border-right-style: hidden;
    }
    .classificacio-increment {
        width: 35px;
        border-left-style: hidden;
    }
    .classificacio-grup {
        width: 70px;
    }
    .classificacio-cua {
        background-color: #BA656A;
    }
    .classificacio-primer {
        background-color: #FFD700;
    }
    .classificacio-segon {
        background-color: #D3D3D3;
    }
    .classificacio-tercer {
        background-color: #D69657;
    }
    </style>
    <title>Dauets</title>
</head>
<body>
    <h1>Dauets</h1>

    <div>
        <p>Adreces d'interès:</p>

        <ul id="adreces_interes">
            <li><a href="/jugadors.html">Cercador de jugadors</a></li>
            <li><a href="/comparador_jugadors.html">Comparador de jugadors</a></li>
            <li><a href="/marcador.html">Marcador</a></li>
            <li><a href="/solitari.html">Dauets solitari</a></li>
        </ul>
    </div>

    <h2>Rànquing de Dauets Professional</h2>
    <div id="classificacio">
        Regió: <select id="seleccionar-regio">
            <option value="mundial">Mundial</option>
        </select>
        <br><br>
        Data: <input type="date" id="seleccionar-data">
        <br><br>
        <button id="mostrar-increment-rdp">Setmanal</button>
        <br><br>
        <div id="taula-classificacio">
        </div>
    </div>

    <div id="salo-fama">
        <h2>Saló de la fama</h2>
    </div>

    <script>
        var increment_setmanal = 1;

        for (var i = 0; i < _tornejos.length; i ++) {
            var li = document.createElement("li");
            var link = document.createElement("a");
            link.href = "/tornejos/" + _tornejos[i].abreviatura + ".html";
            link.innerHTML = _tornejos[i].nom;
            li.appendChild(link);
            document.getElementById("adreces_interes").appendChild(li);
        }

        const regions = Object.keys(_regions);
        for (var i = 0; i < regions.length; i ++) {
            const opcio = document.createElement("option");
            opcio.value = regions[i];
            opcio.innerHTML = regions[i];
            document.getElementById("seleccionar-regio").appendChild(opcio);
        }

        document.getElementById("seleccionar-regio").addEventListener("change", actualitzar_taula_regional);
        document.getElementById("seleccionar-data").addEventListener("change", actualitzar_taula_regional);
        document.getElementById("mostrar-increment-rdp").addEventListener("click", canviar_tipus_increment_rdp);

        document.getElementById("seleccionar-data").valueAsDate = new Date();

        actualitzar_taula_regional();

        // Saló de la fama
        var millor_puntuacio = -100;
        var millors = [];
        var segona_millor_puntuacio = -100;
        var segons_millors = [];
        var tercera_millor_puntuacio = -100;
        var tercers_millors = [];
        for (var i = 0; i < _partides.length; i ++) {
            var partida = _partides[i];

            if (partida.rdp_extra == null || partida.rdp_extra == false) {
                var resultats = puntuacions(partida);
                for (var j = 0; j < partida.jugadors.length; j ++) {
                    var jugador = partida.jugadors[j];
                    if (resultats[jugador] > millor_puntuacio) {
                        tercera_millor_puntuacio = segona_millor_puntuacio;
                        tercers_millors = segons_millors;
                        segona_millor_puntuacio = millor_puntuacio;
                        segons_millors = millors;
                        millor_puntuacio = resultats[jugador];
                        millors = [jugador];
                    } else if (resultats[jugador] == millor_puntuacio) {
                        if (millors.includes(jugador) == false) {
                            millors.push(jugador);
                        }
                    } else if (resultats[jugador] > segona_millor_puntuacio) {
                        tercera_millor_puntuacio = segona_millor_puntuacio;
                        tercers_millors = segons_millors;
                        segona_millor_puntuacio = resultats[jugador];
                        segons_millors = [jugador];
                    } else if (resultats[jugador] == segona_millor_puntuacio) {
                        if (segons_millors.includes(jugador) == false) {
                            segons_millors.push(jugador);
                        }
                    } else if (resultats[jugador] > tercera_millor_puntuacio) {
                        tercera_millor_puntuacio = resultats[jugador];
                        tercers_millors = [jugador];
                    } else if (resultats[jugador] == tercera_millor_puntuacio) {
                        if (tercers_millors.includes(jugador) == false) {
                            tercers_millors.push(jugador);
                        }
                    }
                }
            }
        }

        const salo_fama = document.getElementById("salo-fama");
            
        var p = document.createElement("p");
        p.innerHTML = "1.- " + millor_puntuacio.toString() + " (";
        for (var j = 0; j < millors.length; j ++) {
            if (j > 0) {
                p.innerHTML += ", ";
            }
            p.appendChild(escriure_nom(millors[j], link=true).children[0]);
            p.innerHTML += " ";
            p.appendChild(escriure_nom(millors[j], link=true).children[1]);
        }
        p.innerHTML += ")";
        salo_fama.appendChild(p);

        var p = document.createElement("p");
        p.innerHTML = "2.- " + segona_millor_puntuacio.toString() + " (";
        for (var j = 0; j < segons_millors.length; j ++) {
            if (j > 0) {
                p.innerHTML += ", ";
            }
            p.appendChild(escriure_nom(segons_millors[j], link=true).children[0]);
            p.innerHTML += " ";
            p.appendChild(escriure_nom(segons_millors[j], link=true).children[1]);
        }
        p.innerHTML += ")";
        salo_fama.appendChild(p);

        var p = document.createElement("p");
        p.innerHTML = "3.- " + tercera_millor_puntuacio.toString() + " (";
        for (var j = 0; j < tercers_millors.length; j ++) {
            if (j > 0) {
                p.innerHTML += ", ";
            }
            p.appendChild(escriure_nom(tercers_millors[j], link=true).children[0]);
            p.innerHTML += " ";
            p.appendChild(escriure_nom(tercers_millors[j], link=true).children[1]);
        }
        p.innerHTML += ")";
        salo_fama.appendChild(p);

        //////////////////////////

        function actualitzar_taula_regional() {
            const regio = document.getElementById("seleccionar-regio").value;
            const data = new Date(document.getElementById("seleccionar-data").value);
            if (increment_setmanal == 1) {
                var ultim_diumenge = new Date(document.getElementById("seleccionar-data").value);
                if (ultim_diumenge.getDay() == 0) {
                    ultim_diumenge.setDate(ultim_diumenge.getDate()-7);
                } else {
                    ultim_diumenge.setDate(ultim_diumenge.getDate()-ultim_diumenge.getDay());
                }
            } else {
                var ultim_diumenge = new Date(document.getElementById("seleccionar-data").value);
                ultim_diumenge.setDate(ultim_diumenge.getDate()-1);
            }

            var ultim = calcular_rdp_data(data, _partides);
            var grup = calcular_lliga(ultim);
            var ultima_setmana = calcular_rdp_data(ultim_diumenge, _partides);
            const jugadors = Object.keys(ultim);
            for (var i = jugadors.length-1; i >= 0; i --) {
                if (regio != "mundial") {
                    if (_regions[regio].includes(jugadors[i]) == false) {
                        jugadors.splice(i,1);
                    }
                }
            }
            var taula = document.createElement("table");
            var header = document.createElement("tr");
            var header_posicio = document.createElement("th");
            header_posicio.classList = ["classificacio-posicio"];
            var header_jugadors = document.createElement("th");
            header_jugadors.innerHTML = "Jugador/a";
            var header_daus = document.createElement("th");
            header_daus.innerHTML = "Daus";
            header_daus.setAttribute("colspan", 2);
            var header_grup = document.createElement("th");
            header_grup.innerHTML = "Grup";
            header_grup.classList = ["classificacio-grup"];
            header.appendChild(header_posicio);
            header.appendChild(header_jugadors);
            header.appendChild(header_daus);
            header.appendChild(header_grup);
            taula.appendChild(header);

            var posicions = {};
            var jugadors_afegits = [];
            while (jugadors_afegits.length < jugadors.length) {
                var afegir = false;
                for (var i = 0; i < jugadors.length; i ++) {
                    if (jugadors_afegits.includes(jugadors[i]) == false) {
                        if (afegir == false) {
                            afegir = jugadors[i];
                        } else if (ultim[jugadors[i]] > ultim[afegir]) {
                            afegir = jugadors[i];
                        }
                    }
                }
                if (jugadors_afegits.length == 0) {
                    jugadors_afegits.push(afegir);
                    posicions[afegir] = 1;
                } else {
                    if (ultim[afegir] == ultim[jugadors_afegits[jugadors_afegits.length-1]]) {
                        posicions[afegir] = posicions[jugadors_afegits[jugadors_afegits.length-1]];
                        jugadors_afegits.push(afegir);
                    } else {
                        jugadors_afegits.push(afegir);
                        posicions[afegir] = jugadors_afegits.length;
                    }
                }
                var fila = document.createElement("tr");
                var cella_posicio = document.createElement("td");
                cella_posicio.innerHTML = posicions[afegir].toString();
                cella_posicio.classList = ["classificacio-posicio"];
                fila.appendChild(cella_posicio);

                var cella_jugador = document.createElement("td");
                cella_jugador.classList = ["classificacio-jugador"];
                cella_jugador.appendChild(escriure_nom(afegir, link=true));
                fila.appendChild(cella_jugador);

                var cella_daus = document.createElement("td");
                cella_daus.innerHTML = ultim[afegir].toString();
                cella_daus.classList = ["classificacio-daus"];
                fila.appendChild(cella_daus);

                var cella_increment = document.createElement("td");
                cella_increment.classList = ["classificacio-increment"];
                var increment = 0;
                if (Object.keys(ultima_setmana).includes(afegir)) {
                    increment = ultim[afegir]-ultima_setmana[afegir];
                } else {
                    increment = ultim[afegir]-50;
                }
                if (increment > 0) {
                    cella_increment.innerHTML = "(+" + increment.toString() + ")";
                } else if (increment < 0) {
                    cella_increment.innerHTML = "(" + increment.toString() + ")";
                }
                fila.append(cella_increment);

                var cella_grup = document.createElement("td");
                cella_grup.innerHTML = ["Capdav.","Boldró","Cua"][grup[afegir]-1];
                cella_grup.classList = ["classificacio-grup"];
                fila.appendChild(cella_grup);
                if (posicions[afegir] == 1) {
                    fila.classList = ["classificacio-primer"];
                } else if (posicions[afegir] == 2) {
                    fila.classList = ["classificacio-segon"];
                } else if (posicions[afegir] == 3) {
                    fila.classList = ["classificacio-tercer"];
                }
                if (grup[afegir] == 3) {
                    fila.classList += ["classificacio-cua"];
                }
                taula.appendChild(fila);
            }

            document.getElementById("taula-classificacio").innerHTML = "";
            document.getElementById("taula-classificacio").appendChild(taula);
        }

        function canviar_tipus_increment_rdp() {
            increment_setmanal = (increment_setmanal+1)%2;
            if (increment_setmanal == 1) {
                document.getElementById("mostrar-increment-rdp").innerHTML = "Setmanal";
            } else {
                document.getElementById("mostrar-increment-rdp").innerHTML = "Diari";
            }
            actualitzar_taula_regional();
        }
    </script>
</body>
</html>
